name: Setup
description: Install and cache node_modules

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    # Cache key includes the Node major version: node_modules carries the native
    # better-sqlite3 binary, and even though v13 ships prebuilds rather than
    # compiling, the binary it resolves is still platform/ABI-specific. Each Node
    # version keeps its own cache. This action pre-warms the Node 22 cache (the
    # lowest version this package supports).
    - name: Restore node_modules cache
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: node_modules
        key: node-modules-node22-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Save node_modules cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: node_modules
        key: node-modules-node22-${{ hashFiles('package-lock.json') }}
